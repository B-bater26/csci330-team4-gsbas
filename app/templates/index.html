<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <title>Geospatial Small Business Analysis System</title>
</head>

<body>

    <a href="{{ url_for('logout') }}">Logout</a>
    <a href="{{ url_for('comparison') }}" id="comparison-link">Area Comparison</a>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <div id="input-container">
        <input type="text" id="addressInput" placeholder="Enter Address">
        <input type="range" min="1" max="25" value="10" id="areaRadius">
    </div>
    <div id="checkboxes-container">

        <label class="checkbox-label" for="pop_check"> <input type="checkbox" id="pop_check" class="check"
                value="B01003_001E"> Population</label>

        <label class="checkbox-label" for="age_check"> <input type="checkbox" id="age_check" class="check"
                value="B01003_001E,B01002_001E"> Age</label>

        <label class="checkbox-label" for="sex_check"> <input type="checkbox" id="sex_check" class="check"
                value="B01001_002E,B01001_026E">Sex</label>

        <label class="checkbox-label" for="income_check"> <input type="checkbox" id="income_check" class="check"
                value="B19013_001E">Income</label>

        <label class="checkbox-label" for="households_check"><input type="checkbox" id="households_check" class="check"
                value="B11001_001E">Households</label>

        <label class="checkbox-label" for="vacant_check"><input type="checkbox" id="vacant_check" class="check"
                value="B25002_003E">Vacant Homes</label>

        <label class="checkbox-label" for="home_owner_check"><input type="checkbox" id="home_owner_check" class="check"
                value="B25003_002E">Home Owners</label>

        <label class="checkbox-label" for="renter_check"><input type="checkbox" id="renter_check" class="check"
                value="B25003_003E">Renters</label>

        <label class="checkbox-label" for="median_home_check"><input type="checkbox" id="median_home_check"
                class="check" value="B25077_001E"> Median Home Value</label>

        <label class="checkbox-label" for="education_check"><input type="checkbox" id="education_check" class="check"
                value="B15003_001E,B15003_022E,B15003_023E,B15003_024E,B15003_025E">Education</label>

        <label class="checkbox-label" for="employed_check"><input type="checkbox" id="employed_check" class="check"
                value="B23025_004E,B23025_005E,B23025_003E">Employed/Unemployed</label>


        <label class="checkbox-label" for="commuter_check"><input type="checkbox" id="commuter_check" class="check"
                value="B08301_001E,B08301_003E,B08301_010E">Commuters</label>

        <label class="checkbox-label" for="internet_check"><input type="checkbox" id="internet_check" class="check"
                value="B28002_001E,B28002_002E">Internet</label>
    </div>
    <div id="outputs-container">

    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    <script src="{{ url_for('static', filename='scripts/map.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/address.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/area.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/query_boxes.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/output.js') }}"></script>
</body>

</html>
