<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <title>Geospatial Small Business Analysis System</title>
</head>

<body>
    <div id="map-container">
        <div id="map"></div>
    </div>

    <div id="input-container">
        <input type="text" id="addressInput" placeholder="Enter Address">
        <input type="range" min="1" max="25" value="10" id="areaRadius">
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    <script src="{{ url_for('static', filename='scripts/map.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/address.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/area.js') }}"></script>
</body>

</html>
